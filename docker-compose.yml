name: ewes-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ewes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ewes}
      POSTGRES_DB: ${POSTGRES_DB:-ewes}
    ports:
      # Lié à la machine locale : le mot de passe par défaut ne doit pas être joignable du réseau.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ewes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ewes}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ewes_postgres_data:
